{{- if .Values.ollama.enabled }}
{{- $o := .Values.ollama }}
{{- if $o.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ollama
    {{- include "kubelantern-ai.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with $o.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $o.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ollama
    {{- include "kubelantern-ai.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate          # ReadWriteOnce volume
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
        {{- include "kubelantern-ai.labels" . | nindent 8 }}
    spec:
      containers:
        - name: ollama
          image: {{ $o.image.repository }}:{{ $o.image.tag }}
          imagePullPolicy: {{ $o.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_KEEP_ALIVE
              value: {{ $o.keepAlive | quote }}
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml $o.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          {{- if $o.persistence.enabled }}
          persistentVolumeClaim:
            claimName: ollama-models
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with $o.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $o.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $o.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ollama
    {{- include "kubelantern-ai.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
{{- end }}
