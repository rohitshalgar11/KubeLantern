{{- if .Values.networkPolicy.enabled }}
# Ingress lockdown for the KubeLantern namespace:
#   agents (enabled namespaces) --> gateway --> Ollama / Qdrant
# Nothing else may reach these services.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubelantern-default-deny-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubelantern-ai.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubelantern-gateway-from-agents
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubelantern-ai.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubelantern-gateway
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.agentNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kubelantern-agent
      ports:
        - port: {{ .Values.gateway.port }}
          protocol: TCP
{{- if .Values.ollama.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubelantern-ollama-from-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubelantern-ai.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ollama
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kubelantern-gateway
      ports:
        - port: 11434
          protocol: TCP
{{- end }}
{{- if .Values.qdrant.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubelantern-qdrant-from-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubelantern-ai.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kubelantern-gateway
      ports:
        - port: 6333
          protocol: TCP
{{- end }}
{{- end }}
{{- if .Values.networkPolicy.egress.enabled }}
{{- $egress := .Values.networkPolicy.egress }}
---
# For namespaces with default-deny EGRESS.
# Gateway: DNS, API server (TokenReview), Ollama, Qdrant.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubelantern-gateway-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubelantern-ai.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubelantern-gateway
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $egress.dns.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml $egress.dns.podLabels | nindent 14 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        {{- range $egress.apiServer.ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
      {{- with $egress.apiServer.cidrs }}
      to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      {{- end }}
    {{- if .Values.ollama.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ollama
      ports:
        - port: 11434
          protocol: TCP
    {{- end }}
    {{- if .Values.qdrant.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: qdrant
      ports:
        - port: 6333
          protocol: TCP
    {{- end }}
    {{- if include "kubelantern-ai.hostedAI" . }}
    # Hosted AI provider (llm / embeddings): HTTPS, limited to llm.egressCidrs if set.
    - ports:
        - port: 443
          protocol: TCP
      {{- with (.Values.llm | default dict).egressCidrs }}
      to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      {{- end }}
    {{- end }}
{{- if .Values.ollama.enabled }}
---
# Ollama: DNS, and HTTPS to the internet to download models (optional).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubelantern-ollama-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubelantern-ai.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ollama
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $egress.dns.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml $egress.dns.podLabels | nindent 14 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if $egress.ollamaInternet }}
    - ports:
        - port: 443
          protocol: TCP
    {{- end }}
{{- end }}
{{- end }}
