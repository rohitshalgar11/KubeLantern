# KubeLantern platform — install once per cluster, into its own namespace
# (default name used by the agent chart: kubelantern-ai).

# Pull secrets for private registries, used by the gateway, Ollama and Qdrant
# pods, e.g. [{name: my-registry}]. Not needed on AKS with the ACR attached.
imagePullSecrets: []

gateway:
  image:
    repository: ghcr.io/rohitshalgar11/kubelantern-gateway
    # Defaults to the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  # Chat model used for diagnoses (pulled into Ollama on start if missing).
  model: qwen2.5:1.5b
  # Embedding model for runbook retrieval.
  embedModel: nomic-embed-text
  # Pull missing models at start. Set false if you pre-load models.
  pullModels: true
  # Token audience agents must present (must match the agent chart).
  audience: kubelantern-gateway
  # Diagnoses per namespace per minute.
  ratePerMinute: 6
  # Minimum similarity for a runbook to be used.
  runbookMinScore: 0.35
  logLevel: INFO
  port: 8080
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Which AI model diagnoses incidents. Default: the local Ollama below — nothing
# leaves the cluster. With a hosted provider, the (redacted) incident evidence
# and matching runbook text are sent to that provider. See docs/ai-providers.md.
llm:
  # ollama | openai | azure-openai | anthropic
  #   openai also covers every OpenAI-compatible API (vLLM, LiteLLM, Groq,
  #   Mistral, OpenRouter, Google Gemini's OpenAI endpoint, ...): set baseUrl.
  provider: ollama
  # Model name; empty = gateway.model. Azure OpenAI: your DEPLOYMENT name.
  model: ""
  # openai: empty = https://api.openai.com/v1, or the compatible API's URL.
  # azure-openai: https://<resource>.openai.azure.com (required).
  # anthropic: empty = https://api.anthropic.com.
  baseUrl: ""
  # azure-openai only; empty = 2024-10-21.
  apiVersion: ""
  # Secret in this namespace with key `api-key` (required for hosted providers).
  # Mounted only into the gateway; re-read on every call, so rotation needs no restart.
  existingSecret: ""
  # Per model call; 0 = auto: 180 for ollama (slow on CPU), 60 for hosted models.
  timeoutSeconds: 0
  maxTokens: 1000
  # Diagnoses in parallel; empty/0 = 1 for ollama, 4 for hosted providers.
  maxConcurrency: 0
  # With default-deny egress: the provider's IP ranges (empty = any HTTPS).
  egressCidrs: []

# Embedding model for runbook search. Default: Ollama's nomic-embed-text.
# Anthropic has no embeddings API: keep ollama, or use openai / azure-openai.
embeddings:
  # ollama | openai | azure-openai
  provider: ollama
  # Model name; empty = gateway.embedModel. e.g. text-embedding-3-small;
  # Azure OpenAI: your embeddings DEPLOYMENT name.
  model: ""
  # Empty = llm.baseUrl when the provider is the same as llm.provider.
  baseUrl: ""
  apiVersion: ""
  # Empty = llm.existingSecret. Otherwise a Secret with key `api-key`.
  existingSecret: ""

ollama:
  # false = use an existing Ollama at `externalUrl` (e.g. a GPU node pool), or
  # no Ollama at all when both llm and embeddings use a hosted provider.
  enabled: true
  externalUrl: ""
  image:
    repository: ollama/ollama
    # Pin a specific version in production.
    tag: latest
    pullPolicy: IfNotPresent
  # Keep the model loaded (-1) to avoid cold starts.
  keepAlive: "-1"
  # Where the downloaded models live (~1.3 GB default, ~6 GB with a 7b model).
  # Without persistence they are downloaded again after every pod restart.
  persistence:
    enabled: true
    # pvc            a PVC from a StorageClass (default): Azure Disk/Files, EBS, EFS,
    #                Persistent Disk, Longhorn, Ceph, an NFS CSI class ... any cloud
    # existingClaim  a PVC you created yourself (bound to any PV you like)
    # nfs            an NFS export: mounted directly, or as a PV + PVC
    #                (nfs.createPersistentVolume: true)
    # hostPath       a directory on the node (single-node / dev clusters only)
    # emptyDir       no persistence (models re-downloaded on restart); also when enabled: false
    # custom         any Kubernetes volume source, written out under `custom`
    type: pvc
    size: 8Gi
    # type pvc: empty = the cluster's default StorageClass.
    storageClass: ""
    # empty = ReadWriteOnce (pvc), ReadWriteMany (nfs).
    accessModes: []
    # PVC annotations (e.g. for backup tools).
    annotations: {}
    existingClaim: ""
    nfs:
      server: ""
      path: ""
      # false: the pod mounts the NFS export directly (no PV/PVC).
      # true:  the chart creates a PersistentVolume (Retain) and a PVC bound to it.
      createPersistentVolume: false
      mountOptions: []          # e.g. [nfsvers=4.1, hard]
    hostPath:
      path: /var/lib/kubelantern/ollama
      type: DirectoryOrCreate
    emptyDir:
      # Cap the node disk an emptyDir may use, e.g. 10Gi (empty = no limit).
      sizeLimit: ""
      medium: ""                # "Memory" = tmpfs (counts against memory!)
    # type custom, e.g. Azure Files through the CSI driver:
    #   csi: {driver: file.csi.azure.com, volumeAttributes: {secretName: azure-files, shareName: ollama}}
    custom: {}
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 5Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

qdrant:
  # false = no runbook retrieval (diagnosis still works, without runbooks).
  enabled: true
  image:
    repository: qdrant/qdrant
    tag: v1.12.4
    pullPolicy: IfNotPresent
  # Runbook vectors. They are rebuilt from the runbooks at start, so emptyDir
  # (enabled: false) is fine; a volume only saves re-indexing time.
  # Same options as ollama.persistence.
  persistence:
    enabled: true
    type: pvc
    size: 2Gi
    storageClass: ""
    accessModes: []
    annotations: {}
    existingClaim: ""
    nfs:
      server: ""
      path: ""
      createPersistentVolume: false
      mountOptions: []
    hostPath:
      path: /var/lib/kubelantern/qdrant
      type: DirectoryOrCreate
    emptyDir:
      sizeLimit: ""
      medium: ""
    custom: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Shared runbooks: knowledge every namespace's diagnoses can use (team runbooks
# stay private to their namespace). Stored in ConfigMaps and mounted into the
# gateway, which re-reads them when they change — no image rebuild, no restart.
sharedRunbooks:
  # The library shipped with this chart (runbooks/*.md: common Kubernetes and
  # application failures).
  builtin: true
  # Built-in runbooks to leave out, by name (file name without .md).
  exclude: []
  # Your own shared runbooks, inline: <name>: <Markdown>. A runbook with the same
  # name as a built-in one replaces it.
  extra: {}
  #   our-postgres: |
  #     ---
  #     title: Connecting to the platform PostgreSQL
  #     category: dependency
  #     ---
  #     # Symptoms
  #     ...
  # ConfigMaps in this namespace holding more shared runbooks, one key per
  # runbook ("<name>.md"). Keep them in your own Git repo; edits are picked up
  # automatically. Missing ConfigMaps are ignored. Listed later = wins on a name clash.
  existingConfigMaps: []
  # How often the gateway checks for changed runbooks (seconds; 0 = only at start).
  reloadSeconds: 30

# Cluster-wide maintenance mode (e.g. a cluster upgrade). While paused, every
# agent opens no new incidents, runs no diagnoses and sends no notifications.
# When it ends, agents wait `maintenance.settleSeconds` (agent chart) and then
# re-check all pods, so only what is still broken becomes an incident.
maintenance:
  paused: false
  # End time, RFC 3339 UTC, e.g. "2026-10-07T22:00:00Z". Strongly recommended:
  # the pause ends by itself even if nobody turns it off. Without it, agents
  # cap the pause at their `maintenance.maxHours` (default 12).
  until: ""
  # Shown in agent logs, e.g. "AKS upgrade 1.30 -> 1.31".
  reason: ""

crds:
  # Install the KubeLantern CRDs (Runbook). Disable if you manage CRDs separately.
  install: true
  # Keep CRDs (and therefore every team's Runbook objects) on helm uninstall.
  keep: true

# Agents are admitted from namespaces with these labels.
agentNamespaceSelector:
  kubelantern.io/enabled: "true"

networkPolicy:
  # Ingress lockdown: agents -> gateway -> {Ollama, Qdrant}; nothing else.
  enabled: true
  # For namespaces with a default-deny EGRESS policy.
  egress:
    enabled: false
    dns:
      namespace: kube-system
      podLabels:
        k8s-app: kube-dns
    # The gateway calls the API server for TokenReview.
    apiServer:
      cidrs: []
      ports: [443, 6443]
    # Ollama downloads models from the internet (registry.ollama.ai) on HTTPS.
    # Disable once models are pre-loaded or mirrored.
    ollamaInternet: true
