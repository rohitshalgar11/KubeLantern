{{- $viewers := .Values.incidents.viewers }}
{{- if or $viewers.groups $viewers.users }}
# Lets the listed team members read KubeLantern Incidents in THIS namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubelantern-incident-viewer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubelantern-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kubelantern.io"]
    resources: ["incidents"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubelantern-incident-viewer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubelantern-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubelantern-incident-viewer
subjects:
  {{- range $viewers.groups }}
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ . | quote }}
  {{- end }}
  {{- range $viewers.users }}
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: {{ . | quote }}
  {{- end }}
{{- end }}
