apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubelantern-agent.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubelantern-agent.labels" . | nindent 4 }}
automountServiceAccountToken: false   # mounted explicitly into the agent container only
---
# Namespaced Role — the agent can read this namespace and nothing else.
# The rules come from files/role-rules.yaml and are intentionally NOT
# configurable through values.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubelantern-agent.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubelantern-agent.labels" . | nindent 4 }}
rules:
  {{- .Files.Get "files/role-rules.yaml" | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubelantern-agent.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubelantern-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubelantern-agent.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubelantern-agent.name" . }}
    namespace: {{ .Release.Namespace }}
