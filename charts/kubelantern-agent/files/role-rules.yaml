# KubeLantern diagnostic read profile — FIXED, not configurable, not grown per
# failure type. Rendered into a namespaced Role (never a ClusterRole).
#
# Allowed: read-only access to the objects a workload is made of, in the
#          release namespace only.
# Writes:  ONLY its own KubeLantern Incident records in this namespace (last
#          rule). Never workloads or anything else.
# Never:   secrets, configmaps (both hold credentials in practice),
#          pods/exec, pods/attach, pods/portforward, serviceaccounts/token.
#          Enforced by tests/unit/test_rbac_policy.py and
#          tests/rbac/verify-isolation.sh.
#
# This file is plain YAML on purpose: CI checks it without rendering Helm.

# workloads and their pods
- apiGroups: [""]
  resources: ["pods", "replicationcontrollers"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
# what happened
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["events.k8s.io"]
  resources: ["events"]
  verbs: ["get", "list", "watch"]
# networking: how the workload is reached and what it can reach
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses", "networkpolicies"]
  verbs: ["get", "list", "watch"]
# storage, scaling, scheduling limits (PVC metadata only — never the data)
- apiGroups: [""]
  resources: ["persistentvolumeclaims", "resourcequotas", "limitranges"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["get", "list", "watch"]
# identity metadata (which SA a pod uses — not its token or secrets)
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["get", "list"]
# KubeLantern's own objects: team runbooks in this namespace
- apiGroups: ["kubelantern.io"]
  resources: ["runbooks"]
  verbs: ["get", "list", "watch"]
# The agent's ONLY write: its incident records, so incidents survive restarts
# and teams can `kubectl get incidents`. Never workloads.
- apiGroups: ["kubelantern.io"]
  resources: ["incidents"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
