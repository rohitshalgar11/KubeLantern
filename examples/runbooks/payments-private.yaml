# A PRIVATE payments runbook used by tests/rag/verify-rag.sh to prove that
# other namespaces can never retrieve it. The marker string must never appear
# in a diagnosis for demo or orders.
apiVersion: kubelantern.io/v1alpha1
kind: Runbook
metadata:
  name: payments-private-db
  namespace: payments
spec:
  title: payments database failover (private)
  category: dependency
  content: |
    # Database
    When the app cannot connect to database db on port 5432 because Service db is missing,
    fail over to PAYMENTS-PRIVATE-MARKER pg-payments-prod.internal and page #payments-oncall.
