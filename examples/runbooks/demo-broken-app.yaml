# Example TEAM runbook for the demo namespace. App teams keep files like this in
# their application repo and deploy them with the app (Helm/Kustomize/GitOps).
apiVersion: kubelantern.io/v1alpha1
kind: Runbook
metadata:
  name: broken-app-database
  namespace: demo
spec:
  title: broken-app cannot reach its database
  category: dependency
  workloads: ["broken-app"]
  content: |
    # Our setup
    broken-app talks to the team's PostgreSQL through the Service `db` on port 5432.
    The database is deployed separately from the app with:

        kubectl apply -f examples/demo-db.yaml

    # If `db` is missing
    It was probably not deployed in this environment. Apply examples/demo-db.yaml,
    wait for the db pod to be Ready, then broken-app recovers on its next restart.

    # If `db` exists but connections fail
    Check `kubectl -n demo get endpointslices -l kubernetes.io/service-name=db`.

    # Owner
    demo team — Slack #demo-team-oncall
