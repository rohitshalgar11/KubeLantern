# Stand-in "database" for the demo: a Service `db` with a pod listening on 5432.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: db }
  template:
    metadata:
      labels: { app: db }
    spec:
      containers:
        - name: db
          image: busybox:1.36
          command: ["sh", "-c", "while true; do nc -l -p 5432 >/dev/null 2>&1; done"]
          ports:
            - containerPort: 5432
          resources:
            limits: { cpu: 20m, memory: 16Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: demo
spec:
  selector: { app: db }
  ports:
    - port: 5432
      targetPort: 5432
