# KubeLantern agent settings (subchart values, under the alias "kubelantern").
# The namespace being watched must carry the label kubelantern.io/enabled=true.
kubelantern:
  enabled: true
  incidents:
    resolveAfterSeconds: 300
    viewers:
      groups: ["payments-developers"]   # may run: kubectl get incidents
  networkPolicy:
    egress:
      enabled: true                     # if the namespace is default-deny egress
  runbooks:
    editors:
      groups: ["payments-developers"]   # may add their own Runbooks
