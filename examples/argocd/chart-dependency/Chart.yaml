# Example: any Helm chart of yours that includes the KubeLantern agent as an
# optional dependency. Add the dependency block below to your own Chart.yaml.
apiVersion: v2
name: my-chart
version: 1.0.0
dependencies:
  - name: kubelantern-agent
    alias: kubelantern
    version: 0.2.0
    repository: oci://ghcr.io/rohitshalgar11/charts
    condition: kubelantern.enabled
