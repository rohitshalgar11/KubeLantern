# Image tag does not exist -> ErrImagePull / ImagePullBackOff
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-image
  namespace: demo
  labels: { kubelantern.io/test: imagepull }
spec:
  replicas: 1
  selector:
    matchLabels: { app: bad-image }
  template:
    metadata:
      labels: { app: bad-image }
    spec:
      containers:
        - name: bad-image
          image: nginx:this-tag-does-not-exist-kubelantern
          resources:
            limits: { cpu: 50m, memory: 32Mi }
