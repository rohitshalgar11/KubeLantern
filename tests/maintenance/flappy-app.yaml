# Fails once, then runs fine — like an app that briefly loses its database
# while the cluster is being upgraded. (emptyDir survives container restarts.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flappy-app
  namespace: demo
  labels: { kubelantern.io/test: maintenance }
spec:
  replicas: 1
  selector:
    matchLabels: { app: flappy-app }
  template:
    metadata:
      labels: { app: flappy-app }
    spec:
      containers:
        - name: flappy-app
          image: busybox:1.36
          command: ["sh", "-c", "if [ -f /state/ok ]; then echo recovered; sleep 3600; else touch /state/ok; echo 'FATAL: database unavailable' >&2; exit 1; fi"]
          volumeMounts:
            - { name: state, mountPath: /state }
          resources:
            limits: { cpu: 50m, memory: 32Mi }
      volumes:
        - name: state
          emptyDir: {}
