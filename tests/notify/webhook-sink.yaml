# Test-only webhook receiver: logs every POST body. Lets you see the exact
# Teams / Slack / webhook payloads without a real Teams channel.
# Deployed by `make notify-sink` into namespace kubelantern-test.
apiVersion: v1
kind: Namespace
metadata:
  name: kubelantern-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-sink
  namespace: kubelantern-test
  labels: { app: webhook-sink }
spec:
  replicas: 1
  selector:
    matchLabels: { app: webhook-sink }
  template:
    metadata:
      labels: { app: webhook-sink }
    spec:
      containers:
        - name: sink
          image: kubelantern-agent:dev        # any image with python3
          imagePullPolicy: IfNotPresent
          command: ["python", "-c"]
          args:
            - |
              import socketserver, threading
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class H(BaseHTTPRequestHandler):
                  def log_message(self, *a): pass
                  def do_POST(self):
                      body = self.rfile.read(int(self.headers.get("Content-Length") or 0))
                      print(f"=== POST {self.path}", flush=True)
                      print(body.decode(), flush=True)
                      self.send_response(200); self.end_headers(); self.wfile.write(b"1")
              class Smtp(socketserver.StreamRequestHandler):
                  # Minimal SMTP receiver (no TLS, no auth) for the email channel test.
                  def reply(self, line): self.wfile.write((line + "\r\n").encode())
                  def handle(self):
                      self.reply("220 sink")
                      while True:
                          line = self.rfile.readline().decode(errors="replace").strip()
                          cmd = line[:4].upper()
                          if not line or cmd == "QUIT": self.reply("221 bye"); return
                          if cmd == "DATA":
                              self.reply("354 go"); lines = []
                              while True:
                                  l = self.rfile.readline().decode(errors="replace").rstrip("\r\n")
                                  if l == ".": break
                                  lines.append(l)
                              print("=== EMAIL", flush=True); print("\n".join(lines), flush=True)
                              self.reply("250 queued")
                          else:
                              self.reply("250 ok")
              threading.Thread(target=socketserver.ThreadingTCPServer(("0.0.0.0", 2525), Smtp).serve_forever, daemon=True).start()
              HTTPServer(("0.0.0.0", 8080), H).serve_forever()
          ports:
            - containerPort: 8080
            - containerPort: 2525
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-sink
  namespace: kubelantern-test
spec:
  selector: { app: webhook-sink }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: smtp
      port: 2525
      targetPort: 2525
