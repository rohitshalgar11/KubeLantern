# Exits with code 1 after printing an error -> CrashLoopBackOff
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-app
  namespace: demo
  labels: { kubelantern.io/test: crashloop }
spec:
  replicas: 1
  selector:
    matchLabels: { app: broken-app }
  template:
    metadata:
      labels: { app: broken-app }
    spec:
      containers:
        - name: broken-app
          image: busybox:1.36
          command: ["sh", "-c", "echo 'FATAL: cannot connect to database at db:5432' >&2; sleep 2; exit 1"]
          resources:
            limits: { cpu: 50m, memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: broken-app
  namespace: demo
spec:
  selector: { app: broken-app }
  ports:
    - port: 80
      targetPort: 8080
